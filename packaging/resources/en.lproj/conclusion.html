<h2>Done</h2>
<p>Plug in the SL1 (directly into the Mac, ideally without a hub). In Mixxx, open
<i>Preferences → Sound Hardware</i>, choose <b>“Rane SL1”</b> and 44100 Hz.</p>
<p>To remove the driver, open the <b>“OpenSL1-Uninstall”</b> package, or run <code>sudo packaging/uninstall.sh</code>
from the source tree.</p>
