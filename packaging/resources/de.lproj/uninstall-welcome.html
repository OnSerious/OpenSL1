<h2>OpenSL1 entfernen</h2>
<p>Dieses Paket entfernt den OpenSL1-Treiber (<code>/Library/Audio/Plug-Ins/HAL/OpenSL1.driver</code>) und
startet den Audio-Dienst von macOS neu. Sonst wird nichts verändert.</p>
