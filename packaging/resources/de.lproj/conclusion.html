<!DOCTYPE html><html><head><meta charset="utf-8"><style>body{font-family:-apple-system,sans-serif;font-size:13px}code{font-size:12px}</style></head><body>
<h2>Fertig</h2>
<p>Stecken Sie die SL1 an (direkt am Mac, möglichst ohne Hub). In Mixxx unter
<i>Einstellungen → Soundhardware</i> das Gerät <b>„Rane SL1“</b> und 44100 Hz wählen.</p>
<p>Zum Entfernen das Paket <b>„OpenSL1-Uninstall“</b> öffnen oder im Quelltext-Ordner
<code>sudo packaging/uninstall.sh</code> ausführen.</p>
</body></html>
